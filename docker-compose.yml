version: '3.9'

services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      - '5000:5000'
    environment:
      - ENVIRONMENT=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
    env_file:
      - server/.env
    depends_on:
      - redis
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  redis_data:
